<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 승인</title><style>body{font-family:Arial,"Noto Sans KR";background:#f6f7f9;padding:50px}.box{max-width:600px;margin:auto;background:white;padding:30px;border-radius:16px}button{padding:12px 18px;border:0;border-radius:9px;background:#172033;color:white}</style></head><body><div class="box"><h1 id="h">결제 확인 중...</h1><p id="p"></p><button onclick="location.href='/'">쇼핑몰로 돌아가기</button></div><script>
(async()=>{const q=new URLSearchParams(location.search),paymentKey=q.get("paymentKey"),orderId=q.get("orderId"),amount=q.get("amount");if(!paymentKey||!orderId||!amount){h.textContent="결제 정보가 없습니다.";return}const r=await fetch("/api/payments/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentKey,orderId,amount:Number(amount)})});const d=await r.json();if(!r.ok){h.textContent="결제 승인 실패";p.textContent=d.error||"결제를 확인할 수 없습니다.";return}h.textContent="결제가 완료되었습니다.";p.textContent="주문번호: "+d.id;})()
</script></body></html>
