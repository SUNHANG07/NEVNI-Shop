<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEVNI ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,"Noto Sans KR",sans-serif;color:#172033}
.top{background:#172033;color:#fff;padding:20px 25px;font-weight:800;letter-spacing:1px}
.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.box{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 3px 15px #00000008}
.login{max-width:520px;margin:70px auto}input,select,textarea{width:100%;padding:12px;border:1px solid #dce1e8;border-radius:9px;margin:6px 0 12px;font-size:15px}textarea{min-height:100px}
button{padding:11px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.primary{background:#172033;color:#fff}.danger{background:#b42318;color:#fff}
.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{background:#e9edf3}.tab.active{background:#172033;color:#fff}.panel{display:none}.panel.active{display:block}
.product{display:grid;grid-template-columns:85px 1fr auto;gap:15px;align-items:center;border-top:1px solid #eee;padding:15px 0}
.product img{width:85px;height:75px;object-fit:cover;border-radius:9px;background:#eef1f5}.muted{color:#687386;font-size:14px}
.order{border-top:1px solid #eee;padding:20px 0}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field{background:#f7f8fa;border-radius:10px;padding:12px}.field b{display:block;margin-bottom:5px}.order-items{margin:12px 0;padding:12px;background:#fafafa;border-radius:10px}.status-row{display:flex;gap:8px;align-items:center;margin-top:14px}.status-row select{width:auto;min-width:130px;margin:0}.track-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-top:8px}.track-row input{margin:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f5;font-size:12px;font-weight:700}
@media(max-width:700px){.product{grid-template-columns:70px 1fr}.product .actions{grid-column:2}.order-grid{grid-template-columns:1fr}.track-row{grid-template-columns:1fr}.status-row{align-items:stretch;flex-direction:column}.status-row select{width:100%}}
</style></head><body>
<div class="top">NEVNI ADMIN</div>
<div class="wrap">
<div id="login" class="box login"><h1>관리자 로그인</h1><input id="uid" placeholder="관리자 아이디"><input id="pw" type="password" placeholder="관리자 비밀번호"><button class="primary" onclick="login()">로그인</button></div>

<div id="app" style="display:none">
  <div class="tabs">
    <button id="tabProducts" class="tab active" onclick="showTab('products')">상품 등록/관리</button>
    <button id="tabOrders" class="tab" onclick="showTab('orders')">주문 관리</button>
  </div>

  <section id="productsPanel" class="panel active">
    <div class="box">
      <h2>상품 등록</h2>
      <input id="name" placeholder="상품명">
      <input id="price" type="number" min="0" placeholder="가격">
      <input id="stock" type="number" min="0" step="1" placeholder="재고">
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      <img id="preview" style="display:none;max-width:250px;max-height:170px;border-radius:9px">
      <textarea id="desc" placeholder="상품 설명"></textarea>
      <button class="primary" onclick="create()">상품 등록</button>
    </div>
    <div class="box">
      <h2>등록 상품</h2>
      <div id="list"></div>
    </div>
  </section>

  <section id="ordersPanel" class="panel">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><h2 style="margin-bottom:5px">주문 관리</h2><div class="muted">주문 상태와 배송 추적 정보를 관리합니다.</div></div>
        <button onclick="loadOrders()">새로고침</button>
      </div>
      <div id="orders"></div>
    </div>
  </section>

  <div class="box"><button onclick="logout()">로그아웃</button></div>
</div></div>

<script>
let token="";
const $=x=>document.getElementById(x);
const money=n=>Number(n).toLocaleString("ko-KR")+"원";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("file").onchange=()=>{let f=$("file").files[0];if(!f){$("preview").style.display="none";return}$("preview").src=URL.createObjectURL(f);$("preview").style.display="block"};

function showTab(tab){
  const prod=tab==="products";
  $("productsPanel").classList.toggle("active",prod);
  $("ordersPanel").classList.toggle("active",!prod);
  $("tabProducts").classList.toggle("active",prod);
  $("tabOrders").classList.toggle("active",!prod);
  if(!prod)loadOrders();
}

async function login(){
  let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:$("uid").value.trim(),password:$("pw").value})});
  let d=await r.json();if(!r.ok)return alert(d.error);
  token=d.token;$("login").style.display="none";$("app").style.display="block";loadProducts();loadOrders();
}
async function loadProducts(){
  let r=await fetch("/api/admin/products",{headers:{"x-admin-token":token}});
  if(!r.ok)return logout();
  let a=await r.json();
  $("list").innerHTML=a.map(p=>`<div class="product"><img src="${p.image||""}"><div><b>${esc(p.name)}</b><br>${money(p.price)} · 재고 ${p.stock}개<div class="muted">${esc(p.description)}</div></div><div class="actions"><button class="danger" onclick="del('${p.id}')">삭제</button></div></div>`).join("")||"<p>등록된 상품이 없습니다.</p>";
}
async function create(){
  try{
    let n=$("name").value.trim(),pr=Number($("price").value),st=Number($("stock").value||0);
    if(!n)return alert("상품명을 입력하세요.");
    if(!Number.isFinite(pr)||pr<0)return alert("가격을 입력하세요.");
    if(!Number.isInteger(st)||st<0)return alert("재고를 입력하세요.");
    let fd=new FormData();fd.append("name",n);fd.append("price",String(pr));fd.append("stock",String(st));fd.append("description",$("desc").value);
    let f=$("file").files[0];if(f)fd.append("image",f);
    let r=await fetch("/api/admin/products",{method:"POST",headers:{"x-admin-token":token},body:fd}),d=await r.json();
    if(!r.ok)throw Error(d.error||"상품 등록 실패");
    alert(f?"상품과 이미지가 등록되었습니다.":"상품이 등록되었습니다.");
    $("name").value="";$("price").value="";$("stock").value="";$("desc").value="";$("file").value="";$("preview").style.display="none";loadProducts();
  }catch(e){alert("상품 등록 실패: "+e.message)}
}
async function del(id){if(!confirm("상품을 삭제할까요?"))return;let r=await fetch("/api/admin/products/"+id,{method:"DELETE",headers:{"x-admin-token":token}});if(!r.ok)return alert("삭제 실패");loadProducts()}

async function loadOrders(){
  let r=await fetch("/api/admin/orders",{headers:{"x-admin-token":token}});
  if(!r.ok)return;
  let a=await r.json();
  $("orders").innerHTML=a.slice().reverse().map(o=>{
    const items=(o.items||[]).map(i=>`<div>${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</div>`).join("");
    return `<div class="order">
      <div class="order-head">
        <div><b>주문번호 ${esc(o.id)}</b><div class="muted">${new Date(o.createdAt).toLocaleString("ko-KR")}</div></div>
        <span class="badge">${esc(o.status||"주문접수")}</span>
      </div>
      <div class="order-grid">
        <div class="field"><b>주문자 정보</b>${esc(o.customer?.name||"")}<br>${esc(o.customer?.phone||"")}</div>
        <div class="field"><b>배송지</b>${esc(o.customer?.postal||"")}<br>${esc(o.customer?.address||"")} ${esc(o.customer?.detail||"")}</div>
      </div>
      <div class="order-items"><b>주문 상품</b>${items}<hr><b>주문금액 ${money(o.total)}</b></div>
      <div class="status-row">
        <select id="status-${esc(o.id)}">
          ${["주문접수","결제완료","상품준비","배송중","배송완료","주문취소"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <button class="primary" onclick="updateOrder('${o.id}')">주문 상태 저장</button>
      </div>
      <div class="track-row">
        <input id="carrier-${esc(o.id)}" placeholder="택배사 (예: CJ대한통운)" value="${esc(o.carrier||"")}">
        <input id="tracking-${esc(o.id)}" placeholder="운송장 번호" value="${esc(o.trackingNumber||"")}">
        <button onclick="updateTracking('${o.id}')">배송정보 저장</button>
      </div>
      ${o.trackingNumber?`<div class="muted" style="margin-top:8px">배송: ${esc(o.carrier||"택배사 미입력")} / ${esc(o.trackingNumber)}</div>`:""}
    </div>`;
  }).join("")||"<p>접수된 주문이 없습니다.</p>";
}
async function updateOrder(id){
  const status=$("status-"+id).value;
  const r=await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify({status})});
  const d=await r.json();if(!r.ok)return alert(d.error||"저장 실패");loadOrders();
}
async function updateTracking(id){
  const carrier=$("carrier-"+id).value.trim(),trackingNumber=$("tracking-"+id).value.trim();
  const r=await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-token":token},body:JSON.stringify({carrier,trackingNumber})});
  const d=await r.json();if(!r.ok)return alert(d.error||"저장 실패");alert("배송 추적 정보가 저장되었습니다.");loadOrders();
}
async function logout(){if(token)await fetch("/api/admin/logout",{method:"POST",headers:{"x-admin-token":token}}).catch(()=>{});token="";$("app").style.display="none";$("login").style.display="block"}
</script></body></html>
